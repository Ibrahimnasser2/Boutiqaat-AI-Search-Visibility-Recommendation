services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MOCK_MODE=true
      - DATABASE_URL=sqlite:///./visibility.db
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./reports:/reports

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
